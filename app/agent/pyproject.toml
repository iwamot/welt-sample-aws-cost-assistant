[project]
name = "welt-sample-aws-cost-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore==1.26.1",
    "mcp==2.3.0",
    "mcp-proxy-for-aws==1.8.0",
    "strands-agents==1.65.0",
    "welt-io-strands==0.10.4",
]

[dependency-groups]
dev = ["pip-licenses==5.5.5"]

[tool.uv]
exclude-newer = "1 day"

[tool.uv.audit]
# Check the locked packages against OSV malware advisories before any sync
# installs them, so a compromised release cannot run its install hooks here.
malware-check = true
