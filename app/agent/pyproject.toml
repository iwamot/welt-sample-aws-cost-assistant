[project]
name = "welt-sample-aws-cost-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore==1.28.0",
    "mcp-proxy-for-aws==2.0.0",
    "strands-agents==1.67.0",
    "welt-io-strands==0.10.5",
]

[dependency-groups]
dev = ["pip-licenses==5.5.5"]

[tool.uv]
exclude-newer = "1 day"
# iwamot's own packages are proposed by Renovate without a release age,
# so take them as soon as they are published.
exclude-newer-package = { welt-io-strands = false }

[tool.uv.audit]
# Check the locked packages against OSV malware advisories before any sync
# installs them, so a compromised release cannot run its install hooks here.
malware-check = true
